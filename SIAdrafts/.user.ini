; Session cookie hardening, applied at the ini level so it takes effect
; before any file's session_start() runs, regardless of include order.
; PHP re-reads .user.ini periodically (user_ini.cache_ttl), so under
; FastCGI/PHP-FPM (as on MAMP) this works where .htaccess php_flag/
; php_value cannot.

session.cookie_httponly = On
session.use_strict_mode = On
session.cookie_samesite = "Strict"

; Idle-session backstop. This is probabilistic garbage collection, not a
; deterministic cutoff — the real enforcement is the app-level idle-timeout
; check in Backend/session_security.php (called from require_role.php /
; require_student.php / require_professor.php on every protected request).
; This just keeps stale session files from lingering on disk indefinitely.
session.gc_maxlifetime = 1800

; NOT setting session.cookie_secure here: this app is served over plain
; HTTP in dev (MAMP/localhost, no TLS configured). Forcing Secure would
; silently stop the browser from ever sending the session cookie and
; break every login. Uncomment once served over HTTPS:
; session.cookie_secure = On
