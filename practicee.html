<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="app">
        <h1>Find My Balls</h1>
        <div v-if="phase === 'setup' && phase !== 'matchOver'">
            <h2>Enter Player Names</h2>
            <input v-model="names[0]" placeholder="Player 1">
            <input v-model="names[1]" placeholder="Player 2">
            <button @click="startGame">Start Game</button>
        </div>

        <div v-else>
            <div class="scoreboard">
                <span>{{ names[0] }}'s score: {{ scores[0] }}</span>
                <span>{{ names[1] }}'s score: {{ scores[1] }}</span>
            </div>
        </div>

        <div>
            <template v-if="phase !== 'setup'">
                <h2>{{ message }}</h2>
                <template v-if="phase !== 'matchOver'">
                    <span>Round: {{ round }} / 5</span>
                    <span>Tries left: {{ tries }}</span>
                </template>
                <template v-else>
                    <span>The winner is: {{ winner }}</span>
                </template>
            </template>
        </div>

        <div class="card-grid" v-if="phase !== 'setup'">
            <div v-for="(cup, i) in 10" :class="cupClass(i)" @click="clickCup(i)">
                <span v-if="ballVisible && ball === i">&#9917;</span>
                <img src="cup.png" alt="alt">
            </div>
        </div>

        <div class="action-buttons">
            <button v-if="phase === 'reveal'" @click="phase = 'guessing'">Start Guessing</button>
            <template v-if="phase === 'roundLost' || phase === 'roundWon'">
                <button @click="newRound">Try Again</button>
                <button @click="nextRound">Next Round</button>
            </template>

            <template v-if="phase === 'matchOver'">
                <button @click="restart">Restart Game</button>
                <button @click="phase = 'setup'">Change Players</button>
            </template>
        </div>
    </div>
</body>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script>
    const { createApp } = Vue;
    createApp({
        data(){
            return{
                names: ['', ''],
                scores: [0, 0],
                tries: 3,
                ball: null,
                phase: "setup",
                round: 1,
                wrong: [],
                winner: ''
            }
        },
        computed: {
            hider(){
                return this.round % 2 === 1 ? 0 : 1;
            },
            guesser(){
                return 1 - this.hider;
            },
            ballVisible(){
                return this.phase === "roundLost" || this.phase === "roundWon" || this.phase === "reveal";
            },
            message(){
                var h = this.names[this.hider];
                var g = this.names[this.guesser];
                if(this.phase === "hiding"){
                    return h + " please choose a cup to put ur ball in.";
                }else if(this.phase === "reveal"){
                    return h + " placed the ball under cup " + (this.ball + 1);
                }else if(this.phase === "guessing"){
                    return this.tries < 3 ? "Wrong cup, choose again." : g + " choose a cup for ur guess";
                }else if(this.phase === "roundLost"){
                    return g + " didn't find the ball.";
                }else if(this.phase === "roundWon"){
                    return "Congratulations!! " + g + " found the ball!!"
                }else if(this.phase === "matchOver"){
                    return this.winner + " is the winner of this game!"
                }
            }
        },
        methods: {
            startGame(){
                this.names[0] = this.names[0] || "Player 1";
                this.names[1] = this.names[1] || "Player 2";
                this.round = 1;
                this.scores = [0, 0];
                this.newRound();
            },
            newRound(){
                this.phase = "hiding";
                this.wrong = Array(10).fill(false);
                this.ball = null;
                this.tries = 3;
            },
            restart(){
                this.round = 1;
                this.winner = '';
                this.scores = [0, 0];
                this.newRound();
            },
            cupClass(i){
                if(this.wrong[i]){
                    return "return";
                }
                if(this.phase === "hiding" || this.phase === "guessing"){
                    return "clickable";
                }
                return "disabled";
            },
            clickCup(i){
                if(this.phase === "hiding"){
                    this.ball = i;
                    this.phase = "reveal";
                    return;
                }
                if(this.phase !== "guessing" || this.wrong[i]){
                    return;
                }
                if(i === this.ball){
                    this.givePoint(this.guesser, "roundWon")
                }else{
                    this.wrong[i] = true;
                    this.tries--;
                    if(this.tries === 0){
                        this.givePoint(this.hider, "roundLost");
                    }
                }
            },
            givePoint(p, next){
                this.scores[p]++
                if(this.scores[p] >= 3){
                    this.winner = this.names[p];
                    this.phase = "matchOver";
                }else{
                    this.phase = next;
                }
            },
            nextRound(){
                if(this.round === 5){
                    this.winner = this.scores[0] === this.scores[1]
                        ? "Nobody won (Tie)"
                        : this.names[this.scores[0] > this.scores[1] ? 0 : 1];
                    this.phase = "matchOver";
                }else{
                    this.round++;
                    this.newRound();
                }
            }
        }
    }).mount('#app');
</script>
</html>
